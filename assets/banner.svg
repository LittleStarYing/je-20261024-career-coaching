<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Animated Mesh Glow -->
    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#38bdf8;#60a5fa" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.08); opacity: 0.7; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatCard4 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .wave-line {
        stroke-dasharray: 8 12;
        animation: waveFlow 6s linear infinite;
      }
      .pill-card-1 { animation: floatCard1 4s ease-in-out infinite; }
      .pill-card-2 { animation: floatCard2 4.5s ease-in-out infinite 0.5s; }
      .pill-card-3 { animation: floatCard3 5s ease-in-out infinite 1s; }
      .pill-card-4 { animation: floatCard4 4.2s ease-in-out infinite 1.5s; }
      .pulse-circle { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Ambient Glows (strictly background layer) -->
  <g opacity="0.8">
    <circle cx="150" cy="80" r="180" fill="url(#meshGlow1)" />
    <circle cx="1050" cy="300" r="220" fill="url(#meshGlow2)" />
    <circle cx="600" cy="200" r="160" fill="url(#meshGlow3)" />
  </g>

  <!-- Animated Tech Grid Background -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="660" y1="0" x2="660" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="1020" y1="0" x2="1020" y2="380" />
  </g>

  <!-- Subtle Dynamic Wave Data Flows (lower section behind cards) -->
  <g opacity="0.35">
    <path class="wave-line" d="M 0 310 Q 300 280 600 320 T 1200 300" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="wave-line" d="M 0 330 Q 350 360 700 310 T 1200 340" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Category Tag Badge (Top Foreground) -->
  <g transform="translate(485, 42)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#10b981" class="pulse-circle" />
    <text x="30" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
  </g>

  <!-- MAIN TITLE (Guaranteed Foreground & High Contrast) -->
  <g transform="translate(600, 135)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome AI Career Coaching
    </text>
    <text text-anchor="middle" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Top Platforms • AI Resume Builders • ATS Optimization • Autonomous Job Agents
    </text>
    <text text-anchor="middle" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      SaaS Metrics, Free-Tier Benchmarks &amp; Open-Source Local Agents
    </text>
  </g>

  <!-- DYNAMIC FLOATING PILLS / CAPABILITY CARDS (Positioned cleanly at bottom to never overlap title/subtitle) -->
  <g transform="translate(70, 275)" class="pill-card-1" filter="url(#cardShadow)">
    <rect width="230" height="52" rx="12" fill="#131d33" stroke="#3b82f6" stroke-width="1.4" opacity="0.95" />
    <text x="20" y="32" font-size="20">🎯</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">ATS Optimization</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#93c5fd">Keyword &amp; Score Audit</text>
  </g>

  <g transform="translate(330, 275)" class="pill-card-2" filter="url(#cardShadow)">
    <rect width="240" height="52" rx="12" fill="#151b33" stroke="#8b5cf6" stroke-width="1.4" opacity="0.95" />
    <text x="20" y="32" font-size="20">🤖</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Job Search Agents</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#c4b5fd">Autonomous Multi-Agent</text>
  </g>

  <g transform="translate(600, 275)" class="pill-card-3" filter="url(#cardShadow)">
    <rect width="240" height="52" rx="12" fill="#122332" stroke="#06b6d4" stroke-width="1.4" opacity="0.95" />
    <text x="20" y="32" font-size="20">🎙️</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mock Interview AI</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#67e8f9">Voice &amp; Role Simulation</text>
  </g>

  <g transform="translate(870, 275)" class="pill-card-4" filter="url(#cardShadow)">
    <rect width="260" height="52" rx="12" fill="#1e182e" stroke="#ec4899" stroke-width="1.4" opacity="0.95" />
    <text x="20" y="32" font-size="20">🔒</text>
    <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Local-First &amp; Privacy</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#f472b6">Ollama, CLI &amp; No Cloud Lock-in</text>
  </g>
</svg>
